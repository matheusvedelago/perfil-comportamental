<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil Comportamental</title>
  </head>

  <body>
    <header>
      <h1>Perfil Comportamental</h1>
    </header>

    <main>
      <section id="intro">
        <h2>Apresentação</h2>
        <p>Este é um questionário educacional, composto por 30 perguntas.</p>
        <p>Clique no botão abaixo para iniciar.</p>
        <button id="start-button" type="button">Iniciar questionário</button>
      </section>

      <section id="questionnaire" hidden>
        <h2>Questionário</h2>
      </section>

      <section id="result" hidden>
        <h2>Resultado</h2>
      </section>
    </main>

    <footer>
      <p>
        Ferramenta educacional. Não substitui avaliação psicológica ou
        instrumento profissional validado.
      </p>
    </footer>

    <script src="./js/script.js"></script>
  </body>
</html>
